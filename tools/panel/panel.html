<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf9f5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<title>任务面板</title>
<style>
  /* ────────────────────────────────────────────────────────────────
     配色 = Anthropic 官网色板。上面一组是从 anthropic.com 的
     `--swatch--*` CSS 变量里原样取下来的品牌色，不是凭印象调的；
     下面一组是把它们映射成本面板的语义色。
     语义色里的 ok/warn/bad 用的是品牌色压暗后的版本（olive / kraft /
     fig），因为品牌原值是给大色块用的，直接当正文色放在象牙白底上
     对比度只有 2~3:1，看不清。压暗后都 ≥4.5:1。
     ──────────────────────────────────────────────────────────────── */
  :root{
    --ivory-light:#faf9f5; --ivory-med:#f0eee6; --ivory-dark:#e8e6dc;
    --slate-dark:#141413;  --slate-med:#3d3d3a;  --slate-light:#5e5d59;
    --cloud-light:#d1cfc5; --cloud-med:#b0aea5;  --cloud-dark:#87867f;
    --clay:#d97757; --accent:#c6613f; --oat:#e3dacc; --olive:#788c5d;
    --kraft:#d4a27f; --fig:#c46686; --heather:#cbcadb; --cactus:#bcd1ca;

    --bg:var(--ivory-light); --card:#fff; --card2:var(--ivory-med);
    --line:#1414131a; --line2:#14141333;            /* slate-faded 10 / 20 */
    --fg:var(--slate-dark); --dim:var(--slate-light); --dim2:var(--cloud-dark);
    --acc:var(--clay); --acc-ink:#a94f2c;
    --ok:#647a4c;   --ok-bg:#edf1e7;   --ok-line:#c3cfb1;
    --warn:#8a5a2f; --warn-bg:#f8efe3; --warn-line:#e0c0a0;
    --bad:#a8415f;  --bad-bg:#faedf1;  --bad-line:#e4aec0;
    --purple:#605e8c; --purple-bg:#f1f1f7; --purple-line:#c6c5d9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:1500px;margin:0 auto;padding:20px 22px 60px}
  h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:12.5px}
  a{color:var(--acc-ink);text-decoration:none}
  a:hover{text-decoration:underline}

  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0}
  .tabs{display:flex;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:3px}
  .tab{padding:6px 14px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:13px;white-space:nowrap;border:0;background:none;font-family:inherit}
  .tab:hover{color:var(--fg)}
  .tab.on{background:var(--slate-dark);color:var(--ivory-light)}
  .grow{flex:1}
  input,select,textarea,button{font-family:inherit;font-size:13px}
  input,select,textarea{background:var(--card);border:1px solid var(--line2);color:var(--fg);border-radius:8px;padding:7px 10px}
  input::placeholder{color:var(--dim2)}
  input:focus,select:focus,textarea:focus{outline:2px solid #d9775766;outline-offset:-1px;border-color:var(--acc)}
  button{background:var(--card);border:1px solid var(--line2);color:var(--fg);border-radius:8px;padding:7px 13px;cursor:pointer}
  button:hover{border-color:var(--slate-dark)}
  button.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  button.primary:hover{background:var(--accent);border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}

  /* 横幅：正文左、动作键右。以前只有一句话没有出口——看到"发现疑似重复"却
     既不能说"不是重复"也不能把它按掉，只能每天开面板都被同一句话拦一次。 */
  .banner{border-radius:10px;padding:9px 12px 9px 14px;margin-bottom:8px;font-size:13px;border:1px solid;
          display:flex;gap:12px;align-items:center;justify-content:space-between}
  .btext{min-width:0}
  .bacts{display:flex;gap:4px;flex:none;align-items:center}
  .b-warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .b-bad{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
  .b-ok{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .b-focus{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple)}
  .bact{color:inherit;font-weight:600;white-space:nowrap;font-size:12.5px;
        padding:3px 9px;border-radius:7px;border:1px solid transparent}
  .bact:hover{text-decoration:none;background:#ffffffb0;border-color:currentColor}
  @media (max-width:760px){
    .banner{flex-direction:column;align-items:stretch;gap:8px}
    .bacts{justify-content:flex-end}
  }

  /* ── 看板 ────────────────────────────────────────────────────────────
     结构上是「应用外壳」而不是「一张长网页」：桌面端整页锁死不滚（见下面的
     min-width:761px 块），看板吃掉剩余高度，滚动只发生在每一列内部。

     列**永远排成一行**，放不下就横向滚，绝不换行。上一版用 grid 在 1100px
     以下降成两列两行，结果列内滚动的前提（单行）不成立、自动退回整页滚——
     窗口没最大化或 4K 屏上分屏就会撞上，等于白做。flex + nowrap 从根上消除
     这个分支：任何宽度下都是一行，行为只有一种。

     视觉上参考 Kairos：列不是填色圆角盒子，只用一条竖分隔线隔开；列头是
     粗体名 + 右侧计数。原来那种「四个填色大盒子」在大屏上很压抑。 */
  .cols{display:flex;gap:0;align-items:stretch}
  .col{flex:0 0 var(--colw,320px);min-width:0;display:flex;flex-direction:column;
       padding:0 14px;border-left:1px solid var(--line)}
  .col:first-child{border-left:0;padding-left:0}
  .col.drag{background:#d9775714;border-radius:10px}
  .col h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;
          align-items:center;color:var(--fg);font-weight:600;flex:none}
  .col h3 span{color:var(--dim2);font-weight:500;font-size:12px;
               background:var(--ivory-med);border-radius:99px;padding:1px 8px;min-width:22px;text-align:center}
  .colbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  /* 几条系统默认滚动条并排立在卡片边上太抢眼，收细 */
  .colbody{scrollbar-width:thin;scrollbar-color:var(--cloud-light) transparent}
  .colbody::-webkit-scrollbar{width:8px}
  .colbody::-webkit-scrollbar-thumb{background:var(--cloud-light);border-radius:99px}
  .colbody::-webkit-scrollbar-track{background:transparent}

  /* 卡片：左侧一道优先级色条 + 标题 + 一行灰字。别再堆药丸了——四列并排时
     满屏都是灰色小圆角，真正要读的标题反而被淹掉。 */
  .card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--cloud-light);
        border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-width:0;
        transition:border-color .12s,box-shadow .12s}
  .card:hover{border-color:var(--line2);border-left-color:var(--acc);box-shadow:0 2px 8px #1414130f}
  .card.p高{border-left-color:var(--accent)} .card.p中{border-left-color:var(--kraft)} .card.p低{border-left-color:var(--cloud-light)}
  .card .t{font-size:13.5px;line-height:1.45;margin-bottom:5px;overflow-wrap:anywhere}
  .meta{display:flex;gap:5px;flex-wrap:wrap;align-items:baseline;font-size:11.5px;color:var(--dim2)}
  .meta b{font-weight:600}
  .m-dot{font-style:normal;color:var(--cloud-med)}
  .m-stale{color:var(--warn)} .m-stale.hot{color:var(--bad)}
  .m-due{color:var(--ok)} .m-due.over{color:var(--bad)}
  .m-proj{color:var(--purple)}
  .next{color:var(--dim);font-size:11.5px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 列表/分组视图里还在用药丸，保留样式 */
  .chip{background:var(--card);border:1px solid var(--line2);border-radius:999px;padding:1px 7px;color:var(--dim)}
  .chip.stale{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
  .chip.stale.hot{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
  .chip.due{background:var(--ok-bg);border-color:var(--ok-line);color:var(--ok)}
  .chip.due.over{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
  .chip.proj{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple)}

  /* 四象限 */
  .quad{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .qbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:140px}
  .qbox.drag{border-color:var(--acc);background:var(--ivory-dark)}
  .qbox h3{margin:0 0 4px;font-size:13px}
  .qhint{color:var(--dim);font-size:11.5px;margin-bottom:9px}
  /* 收口区：做完/不做了。虚线边框是"这里是个投放口"的通用语汇，和上面四个实心格子区分开 */
  .quadbin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
  .qbin{border:1px dashed var(--line);border-radius:12px;padding:12px 14px;display:flex;
    align-items:baseline;gap:10px;color:var(--dim);font-size:13px;flex-wrap:wrap}
  .qbin b{color:var(--fg);font-weight:600}
  .qbin.drag{border-color:var(--acc);border-style:solid;background:var(--ivory-dark);color:var(--fg)}
  /* 列头上的归档入口。默认低调，悬上去才变重——它是破坏性操作，不该抢眼到让人误点 */
  .colact{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:7px;
    padding:2px 8px;font-size:11.5px;font-weight:400;white-space:nowrap}
  .colact:hover{color:var(--fg);border-color:var(--acc)}
  .colact.armed{color:var(--bad);border-color:var(--bad)}

  /* 列表 */
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:12.5px}
  th{background:var(--card2);color:var(--dim);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--fg)}
  tr:last-child td{border-bottom:0}
  tbody tr{cursor:pointer} tbody tr:hover{background:var(--ivory-light)}

  /* 体检 */
  .hsum{padding:11px 14px;border-radius:10px;font-size:13px;margin:0 0 4px;border:1px solid var(--line)}
  .hsum.ok{background:var(--ok-bg,var(--card2));color:var(--ok)}
  .hsum.bad{background:var(--card2);color:var(--fg)}
  /* 全清的区压成一行，不再用整块空白告诉你"这里没事"——四个空区读下来像四条坏消息 */
  .hok{color:var(--dim);font-size:12.5px;padding:2px 2px 6px}
  td.hacts{text-align:right;white-space:nowrap;width:1%}
  .hact{color:var(--dim);text-decoration:none;border:1px solid var(--line);border-radius:7px;
    padding:2px 8px;font-size:11.5px;margin-left:6px;display:inline-block}
  .hact:hover{color:var(--fg);border-color:var(--acc)}
  td .hact:first-child{margin-left:0}
  /* 标题那一格的链接是普通文字样式，别被上面的按钮框套住 */
  td>a.hact:not([data-hact]){border:0;padding:0;margin:0;color:var(--fg);font-size:12.5px}
  td>a.hact:not([data-hact]):hover{color:var(--acc)}

  /* 分组 */
  .grp{margin-bottom:18px}
  .grp>h3{font-size:13px;margin:0 0 8px;color:var(--dim);display:flex;gap:8px;align-items:center}
  .grp .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}

  /* 抽屉 */
  .mask{position:fixed;inset:0;background:#14141359;display:none;z-index:40}
  .mask.on{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);background:var(--card);
          border-left:1px solid var(--line2);box-shadow:-16px 0 48px #14141314;
          z-index:41;transform:translateX(100%);transition:transform .16s;
          display:flex;flex-direction:column}
  .drawer.on{transform:none}
  .dhead{padding:16px 18px;border-bottom:1px solid var(--line);background:var(--card2)}
  .dbody{padding:16px 18px;overflow:auto;flex:1}
  .dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;background:var(--card2)}
  /* minmax(0,1fr)：input/select/textarea 都有固有最小宽度，裸 1fr 会让它们在窄抽屉里撑破布局 */
  .fields{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 12px;align-items:center;margin-bottom:18px}
  .fields label{color:var(--dim);font-size:12.5px}

  /* 时间线 */
  .tl{border-left:2px solid var(--oat);margin-left:6px;padding-left:16px}
  .tl .ev{position:relative;padding-bottom:14px}
  .tl .ev::before{content:'';position:absolute;left:-22px;top:6px;width:8px;height:8px;border-radius:50%;
                  background:var(--cloud-med);border:2px solid var(--card)}
  .tl .ev:last-child::before{background:var(--acc)}
  .tl .when{color:var(--dim2);font-size:11.5px}
  .tl .what{font-size:12.5px;white-space:pre-wrap;word-break:break-word}

  .sec{margin:22px 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:9px}
  .sec .sub{font-weight:400}
  .empty{color:var(--dim2);font-size:12.5px;padding:14px;text-align:center}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--slate-dark);
         border:1px solid var(--slate-dark);color:var(--ivory-light);box-shadow:0 8px 24px #14141426;
         border-radius:9px;padding:9px 16px;font-size:13px;z-index:50;display:none}
  .toast.on{display:block}
  .toast.bad{background:#8f2f4c;border-color:#8f2f4c;color:#fff}
  .ro .card,.ro tbody tr{cursor:default}

  /* 快捷键速查（按 ?）。不做成弹窗浮层：它不该挡住你正在看的看板。 */
  .keys{position:fixed;right:20px;bottom:20px;z-index:60;display:none;
        background:var(--card);border:1px solid var(--line2);border-radius:11px;
        box-shadow:0 10px 30px #14141422;padding:12px 14px;font-size:12.5px;min-width:250px}
  .keys.on{display:block}
  .keys h4{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600}
  .keys div{display:flex;justify-content:space-between;gap:16px;padding:2.5px 0;color:var(--dim)}
  .keys kbd{font:600 11.5px ui-monospace,Consolas,monospace;color:var(--fg);
            background:var(--ivory-med);border:1px solid var(--line2);border-radius:5px;padding:1px 6px}
  .khint{background:none;border:none;color:var(--dim2);font-size:12px;cursor:pointer;padding:6px 4px}
  .khint:hover{color:var(--fg)}
  @media (max-width:760px){ .keys,.khint{display:none} }   /* 触屏没键盘，别占地方 */

  /* 新建任务弹窗 */
  .dlg{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:42;display:none;
       background:var(--card);border:1px solid var(--line2);border-radius:14px;
       box-shadow:0 24px 64px #14141329;width:min(440px,92vw);padding:18px}
  .dlg.on{display:block}
  .dlg h3{margin:0 0 14px;font-size:15px}
  .dlg .fields{margin-bottom:14px}
  .dlg .row{display:flex;gap:8px;justify-content:flex-end}
  textarea{width:100%;resize:vertical;line-height:1.6}

  /* ── 响应式 ──────────────────────────────────────────────────────
     PWA 的全部意义就是装到手机上。四列看板在 390px 宽的屏幕里会横向铺开、
     卡片被截断，等于装了也没法用。所以窄屏逐级降列，并且把桌面才有的
     拖拽提示换成触屏能懂的说法（HTML5 drag 在触屏上根本不触发）。 */
  .only-narrow{display:none}

  /* ── 桌面：应用外壳，整页锁死不滚 ───────────────────────────────────
     Kairos 也是这么做的（body{overflow:hidden}）。整页能滚就必然出现
     「为了看第 13 张卡把标题、横幅、工具栏、另外三列全滚出屏幕」——
     这是最开始那版最大的毛病，靠 JS 算高度补不干净（算错一次就前功尽弃，
     FIT_PAD 那次就是）。改成纯 CSS 的 flex 外壳：高度由浏览器分配，
     横幅多几条、窗口拖动、接副屏，全都自动正确，没有需要维护的算式。 */
  @media (min-width:761px){
    html,body{height:100%;overflow:hidden}
    .wrap{max-width:none;height:100%;display:flex;flex-direction:column;
          padding:18px 26px 16px;gap:0}
    /* 顶部（标题/横幅/工具栏）固定，看板吃掉剩下的高度 */
    #view{flex:1;min-height:0;overflow:auto}
    /* 看板：列不换行，多到放不下就横向滚 */
    #view .cols{height:100%;overflow-x:auto;overflow-y:hidden}
    #view .cols{scrollbar-width:thin;scrollbar-color:var(--cloud-light) transparent}
    #view .cols::-webkit-scrollbar{height:9px}
    #view .cols::-webkit-scrollbar-thumb{background:var(--cloud-light);border-radius:99px}
  }
  /* 屏幕越宽列就越宽，但不无限撑：4K 上四列各 320px 会瘦得可笑，各 700px 又太空 */
  @media (min-width:1500px){ .cols{--colw:380px} }
  @media (min-width:2000px){ .cols{--colw:440px} }
  @media (min-width:2800px){ .cols{--colw:500px} }

  @media (max-width:760px){
    .wrap{padding:14px 12px 48px}
    h1{font-size:19px}
    /* 手机上看板竖排成一列一列，整页滚才对——那里没有"另外三列被滚掉"的问题 */
    .cols{display:block}
    .col{border-left:0;border-top:1px solid var(--line);padding:12px 0 0;margin-top:12px}
    .col:first-child{border-top:0;margin-top:0;padding-top:0}
    .colbody{overflow:visible}
    /* 必须 minmax(0,1fr) 而不是 1fr —— 同一个坑栽过两次：1fr 的下限是 auto(内容最小宽度)，
       单列时列会被卡片内容顶到比视口还宽，整页横向溢出。已有测试钉死这条。 */
    .quad{grid-template-columns:minmax(0,1fr)}
    /* 收口区在手机上直接不显示：HTML5 拖拽在触屏上根本不触发，
       摆两个写着"拖进来"的框只会让人戳半天。手机上点开任务改状态即可。 */
    .quadbin{display:none}
    .grp .cards{grid-template-columns:minmax(0,1fr)}
    .only-narrow{display:inline}
    .only-wide{display:none}
    /* 视图切换横向可滑，不换行挤掉筛选器 */
    .tabs{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .bar{gap:6px}
    .bar input#q{flex:1 1 100%;width:auto!important}
    .bar select{flex:1 1 30%;min-width:0}
    .grow{display:none}
    #btnNew{flex:1 1 60%} #btnReload{flex:1 1 30%}
    /* 列表视图：窄屏砍掉次要列，剩下的才读得下去 */
    th:nth-child(3),td:nth-child(3),th:nth-child(4),td:nth-child(4),
    th:nth-child(8),td:nth-child(8){display:none}
    .drawer{width:100vw}
    .dfoot{flex-wrap:wrap}
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>任务面板</h1>
  <div class="sub" id="sub">加载中…</div>

  <div id="banners"></div>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="tab on" data-v="board">看板</button>
      <button class="tab" data-v="quad">四象限</button>
      <button class="tab" data-v="list">列表</button>
      <button class="tab" data-v="group">分组</button>
      <button class="tab" data-v="archive">归档</button>
      <button class="tab" data-v="health">体检</button>
    </div>
    <input id="q" placeholder="搜索标题 / 项目 / 进度正文…" style="width:230px">
    <select id="fh"><option value="">全部周期</option></select>
    <select id="fp"><option value="">全部项目</option></select>
    <select id="fpri"><option value="">全部优先级</option></select>
    <span class="grow"></span>
    <button id="btnNew" class="primary">+ 新建任务</button>
    <button id="btnReload">刷新</button>
    <button id="btnKeys" class="khint" title="快捷键">?</button>
  </div>

  <div id="view"></div>
</div>

<div class="mask" id="mask"></div>
<div class="drawer" id="drawer">
  <div class="dhead">
    <div style="font-size:15px;font-weight:600" id="dTitle"></div>
    <div class="sub" id="dSub"></div>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot">
    <input id="dProg" placeholder="补一条进度…" style="flex:1">
    <button id="dAdd" class="primary">追加</button>
    <button id="dClose">关闭</button>
  </div>
</div>

<div class="dlg" id="newDlg">
  <h3>新建任务</h3>
  <div class="fields">
    <label>标题</label><input id="nTitle" placeholder="任务标题（也是文件名）">
    <label>周期</label><select id="nHorizon"></select>
    <label>优先级</label><select id="nPriority"></select>
    <label>项目</label><input id="nProject" placeholder="（可留空）">
    <label>截止日</label><input id="nDeadline" type="date">
    <label>下一步</label><textarea id="nPlan" rows="3" placeholder="一行一条（可留空）"></textarea>
  </div>
  <div class="row">
    <button id="nCancel">取消</button>
    <button id="nOk" class="primary">创建</button>
  </div>
</div>

<!--
  拖进「紧急」那两格时要补的截止日。
  以前拖左半边（重要且紧急 / 不重要但紧急）等于白拖：drop 只改优先级，而"紧急"是按截止日
  算出来的，卡片于是当场弹到右边那格去。四个格子有两个根本放不进东西。
  现在拖左边会问一句"那截止日定几号"——紧急依旧由截止日客观决定，但你拖的那一下真的算数。
-->
<div class="dlg" id="quadDlg">
  <h3 id="qdTitle"></h3>
  <div class="sub" id="qdWhy" style="margin:-8px 0 14px;line-height:1.6"></div>
  <div class="row" id="qdQuick" style="justify-content:flex-start;flex-wrap:wrap;margin-bottom:10px"></div>
  <div class="fields"><label>或自己选个日期</label><input id="qdDate" type="date"></div>
  <div class="row">
    <button id="qdSkip">只改优先级</button>
    <button id="qdCancel">取消</button>
    <button id="qdOk" class="primary">确定</button>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="keys" id="keys"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const ST_CN = { running: '进行中', blocked: '阻塞', done: '已完成', cancelled: '已取消' };
const ST_ORDER = ['running', 'blocked', 'done', 'cancelled'];
const closed = (t) => t.status === 'done' || t.status === 'cancelled';

let S = { tasks: [], health: null, meta: {}, link: null, offline: false };
let cur = null;               // 抽屉里打开的任务
// 体检横幅点「只看这些」后的聚焦集合：{label, names:Set}。不落 prefs——
// 它是"我现在要处理这一批"的临时视角，不该在明天打开面板时还扣着。
let focus = null;
// 离线横幅按掉：只在本次离线期间有效——服务端这会儿连不上、存不下来，
// 而恢复联机后这条本来也不该再出现。
let offlineHidden = false;

// 视图/筛选/排序记在本地：每次刷新都跳回「看板·无筛选」很烦——
// 你盯着"项目=求职"看了一上午，一次自动刷新就给你清了。
const PREF_KEY = 'panel.prefs.v1';
const prefs = (() => {
  try { return JSON.parse(localStorage.getItem(PREF_KEY)) || {}; } catch (_) { return {}; }
})();
let view = prefs.view || 'board';
let sortKey = prefs.sortKey || 'staleDays', sortDir = prefs.sortDir || -1;
function savePrefs() {
  try {
    localStorage.setItem(PREF_KEY, JSON.stringify({
      view, sortKey, sortDir,
      q: $('q').value, fh: $('fh').value, fp: $('fp').value, fpri: $('fpri').value,
    }));
  } catch (_) {}
}

// ---------------------------------------------------------------- 通信

async function api(name, body) {
  const r = await fetch('/api/' + name, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '请求失败');
  return j.data;
}

function toast(msg, bad) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, bad ? 5200 : 2600);
}

async function reload() {
  try {
    S = await api('state');
    // 离线时页面转只读：SW 回放的是快照，这时候放任写操作会让人以为改成功了
    document.getElementById('wrap').classList.toggle('ro', !!S.offline);
    fillFilters();
    render();
  } catch (e) { toast('加载失败：' + e.message, true); }
}

// ---------------------------------------------------------------- 过滤

let filtersRestored = false;

function fillFilters() {
  // 首次填充时用上次存的值，之后保留用户当前的选择（下拉选项会随数据变，不能每次重置）
  const keep = (sel, arr, ph, saved) => {
    const v = filtersRestored ? sel.value : (saved || '');
    sel.innerHTML = '<option value="">' + ph + '</option>' +
      arr.map((x) => '<option' + (x === v ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
  };
  keep($('fh'), S.meta.horizons || [], '全部周期', prefs.fh);
  keep($('fp'), S.meta.projects || [], '全部项目', prefs.fp);
  keep($('fpri'), S.meta.priorities || [], '全部优先级', prefs.fpri);
  if (!filtersRestored) { if (prefs.q) $('q').value = prefs.q; filtersRestored = true; }
}

function visible(bucket) {
  const q = $('q').value.trim().toLowerCase();
  const h = $('fh').value, p = $('fp').value, pri = $('fpri').value;
  // 搜正文而不只是标题：想找"那个提到 DevHub 的任务"时，关键词几乎总在进度里。
  // haystack 由服务端拼好下发（标题+项目+说明+进度+下一步，已小写、已截断）。
  return S.tasks.filter((t) =>
    t.bucket === bucket &&
    (!focus || focus.names.has(t.name)) &&
    (!q || (t.haystack || (t.title + ' ' + t.name).toLowerCase()).includes(q)) &&
    (!h || t.horizon === h) && (!p || t.project === p) && (!pri || t.priority === pri));
}

/** 体检横幅点进来的"只看这些"。任务可能横跨多列，所以看板/列表都照样管用。 */
function setFocus(names, label) {
  focus = names && names.length ? { label, names: new Set(names) } : null;
  render();
}

// ---------------------------------------------------------------- 卡片

/** 日期显示成 6-16；跨年了才带上年份，否则一眼看去全是 2026- 的噪声。 */
const NOW_Y = new Date().getFullYear();
function shortDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  if (!m) return '';
  return +m[1] === NOW_Y ? `${+m[2]}-${+m[3]}` : `${m[1]}-${+m[2]}-${+m[3]}`;
}

/**
 * 卡片第二行。以前这里堆 3~6 个 chip（停滞 92 天 / 短期 / 1 条进度 / 高 …），
 * 四列并排时整屏都是灰药丸，真正要看的标题反而被淹了。现在只留一行，且：
 *
 * - **写具体日期，不写"短期"**。"短期/中期/长期"在卡片上说明不了任何事——
 *   看到"停滞 92 天"时想知道的是"上一次动它是哪天"，那个日期恰恰就是这个数的来源。
 *   周期还在抽屉里、也还能筛选，只是不占卡片。
 * - 优先级不再单列一个 chip：左边那道色条就是它。
 */
function metaLine(t) {
  const c = [];
  const done = closed(t);
  if (!done && t.staleDays != null && t.staleDays >= 7) {
    const hot = t.staleDays >= (S.meta.staleThreshold || 30);
    c.push('<b class="m-stale' + (hot ? ' hot' : '') + '">停滞 ' + t.staleDays + ' 天</b>');
  }
  const anchor = shortDate(done ? (t.completed || t.lastActivity) : t.lastActivity);
  if (anchor) c.push('<span>' + (done ? '完成于 ' : '最后动 ') + anchor + '</span>');
  if (!done && t.daysLeft != null) {
    c.push('<b class="m-due' + (t.daysLeft < 0 ? ' over' : '') + '">' +
      (t.daysLeft < 0 ? '逾期 ' + (-t.daysLeft) + ' 天' : t.daysLeft === 0 ? '今天截止' : '剩 ' + t.daysLeft + ' 天') +
      (t.deadline ? '（' + shortDate(t.deadline) + '）' : '') + '</b>');
  }
  if (t.project) c.push('<span class="m-proj">' + esc(t.project) + '</span>');
  return c.join('<i class="m-dot">·</i>');
}

const cardHtml = (t) =>
  '<div class="card' + (t.priority ? ' p' + t.priority : '') + '" draggable="' + (S.offline ? 'false' : 'true') +
  '" data-name="' + esc(t.name) + '" data-bucket="' + esc(t.bucket) + '">' +
    '<div class="t">' + esc(t.title) + '</div>' +
    '<div class="meta">' + metaLine(t) + '</div>' +
    (t.nextFirst ? '<div class="next">→ ' + esc(t.nextFirst) + '</div>' : '') +
  '</div>';

// ---------------------------------------------------------------- 各视图

function render() {
  $('sub').innerHTML = subLine();
  $('banners').innerHTML = banners();
  syncTitle();
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('on', b.dataset.v === view));
  const v = $('view');
  if (view === 'board') v.innerHTML = renderBoard();
  else if (view === 'quad') v.innerHTML = renderQuad();
  else if (view === 'list') v.innerHTML = renderList('active');
  else if (view === 'group') v.innerHTML = renderGroup();
  else if (view === 'archive') v.innerHTML = renderList('archive');
  else v.innerHTML = renderHealth();
  wire();
}

/** 标签页标题带上信号。面板在电脑上多半是钉住的后台标签——
    切过去之前就该知道有没有事，而不是"任务面板"四个字看一整天。 */
function syncTitle() {
  const h = S.health || {}, bits = [];
  if (S.offline) bits.push('离线');
  else if (S.link && !S.link.ok) bits.push('⚠ 联动断开');
  if (h.overdue && h.overdue.length) bits.push('⛔' + h.overdue.length);
  if (h.stale && h.stale.length) bits.push('⏳' + h.stale.length);
  document.title = (bits.length ? bits.join(' ') + ' · ' : '') + '任务面板';
}

// 看板高度不再由 JS 算。以前是 fitBoard() 量出"视口还剩多少"再把每列 max-height 钉死，
// 前后栽了两次：底部留白写成 24 而 .wrap 是 60（整页残留 35px 可滚）、以及 1100px 以下
// 降成两列两行后每列仍按整屏高算（两行叠起来页面滚得更长）。现在整个交给 CSS：
// 桌面下 html/body 锁死不滚、.wrap 是 flex 列、#view 吃掉剩余高度、列内 .colbody 滚。
// 浏览器自己会随窗口和横幅数量重排，没有需要维护的算式，也就没有算错的可能。

function subLine() {
  const c = (S.health && S.health.counts) || {};
  const bits = ['共 <b>' + (c.total || 0) + '</b> 个活跃任务'];
  for (const s of ST_ORDER) if (c[s]) bits.push(ST_CN[s] + ' ' + c[s]);
  if (S.offline) bits.push('<span style="color:var(--warn)">离线快照（只读）</span>');
  return bits.join(' · ');
}

// 体检横幅上的「只看这些 →」。以前横幅只是句报告：告诉你有 6 个停滞任务，
// 然后你得自己回看板一个个找出是哪 6 个。电脑上这一步本该是一次点击。
const focusSets = {};
function focusLink(key, names, label) {
  if (!names.length) return '';
  focusSets[key] = { names, label };
  return '<a href="#" class="bact bfocus" data-focus="' + esc(key) + '">只看这些 →</a>';
}

/**
 * 横幅的按掉键。
 *
 * key 里带上**涉及的任务名**（排序后），所以按掉的是「这一批」而不是「这类提醒」：
 * 再有新任务停滞、或重复组的成员变了，key 就变了，横幅照常回来。
 * 否则就成了"眼不见为净"——把真出现的新问题一起静音掉，比不提醒还糟。
 */
const dkey = (kind, names) => kind + ':' + [...names].sort().join('|');
const isDismissed = (key) => !!(S.dismissed && S.dismissed[key]);
function dismissBtn(key, label) {
  return '<a href="#" class="bact bdismiss" data-key="' + esc(key) + '" title="按掉这条；' +
    '涉及的任务有变化时会重新出现">' + (label || '知道了 ×') + '</a>';
}

function banners() {
  if (!S.health) return '';
  const h = S.health, out = [];
  const row = (cls, html) => out.push('<div class="banner ' + cls + '"><div class="btext">' + html.text + '</div>' +
    '<div class="bacts">' + (html.acts || '') + '</div></div>');

  if (focus) {
    row('b-focus', {
      text: '🔎 只看「<b>' + esc(focus.label) + '</b>」（' + focus.names.size + ' 个任务）',
      acts: '<a href="#" class="bact bfocus" data-focus="">显示全部 ×</a>',
    });
  }
  // 联动状态优先：如果改动发不到飞书，这是你最该先知道的事——
  // 否则你在面板上改了一上午，以为手机那头都同步了，其实一条没出去。
  // 这条**不给按掉**：它不是提醒，是故障，按掉只会让你以为一切正常。
  if (S.link && !S.link.ok && !S.offline) {
    row('b-bad', { text: '🔌 <b>飞书联动未生效</b> —— ' + esc(S.link.reason) +
      '<br><span style="opacity:.75">面板上的改动照常写进任务文件，只是不会在飞书里播报。</span>' });
  }
  // 离线快照可以按掉：知道了就不必一直占着一条。按掉只在本次离线期间有效
  // （服务端这会儿连不上，存不了；恢复联机后本来也不该再显示）。
  if (S.offline && !offlineHidden) {
    row('b-warn', {
      text: '⚠ 面板服务没在运行，正在显示<b>离线快照</b>' +
        (S.snapshotAt ? '（' + esc(String(S.snapshotAt).slice(0, 16).replace('T', ' ')) + '）' : '') +
        '。可以查看，但改不了——从托盘启动面板后刷新即可。',
      acts: '<a href="#" class="bact" id="hideOffline">知道了 ×</a>',
    });
  }
  if (h.overdue && h.overdue.length) {
    const names = h.overdue.map((x) => x.name), k = dkey('overdue', names);
    if (!isDismissed(k)) row('b-bad', {
      text: '⛔ <b>' + h.overdue.length + '</b> 个任务已逾期：' +
        h.overdue.slice(0, 3).map((x) => esc(x.title) + '（' + (-x.left) + ' 天）').join('、'),
      acts: focusLink('overdue', names, '已逾期') + dismissBtn(k),
    });
  }
  if (h.stale && h.stale.length) {
    const names = h.stale.map((x) => x.name), k = dkey('stale', names);
    if (!isDismissed(k)) row('b-warn', {
      text: '⏳ <b>' + h.stale.length + '</b> 个进行中的任务停滞超过 ' + h.staleThreshold +
        ' 天，最久 <b>' + h.stale[0].days + ' 天</b>：' + esc(h.stale[0].title),
      acts: focusLink('stale', names, '停滞超过 ' + h.staleThreshold + ' 天') + dismissBtn(k),
    });
  }
  // 重复：一组一条横幅，各自独立按掉。以前是把所有组挤在一句话里，
  // 既看不清哪几个跟哪几个重，也没法只否掉其中一组。
  for (const g of (h.duplicates || [])) {
    const names = g.map((x) => x.name), k = dkey('dup', names);
    if (isDismissed(k)) continue;
    row('b-warn', {
      text: '🔁 疑似重复：' + g.map((x) => '<b>' + esc(x.title) + '</b>').join(' × '),
      acts: focusLink('dup:' + k, names, '疑似重复') +
        dismissBtn(k, '不是重复 ×'),
    });
  }
  return out.join('');
}

/** 归档只放行这两个状态——和服务端 tasks.archive 的安全底线一致：未完成的绝不归档。 */
const ARCHIVABLE = ['done', 'cancelled'];

function renderBoard() {
  const ts = visible('active');
  return '<div class="cols">' + ST_ORDER.map((s) => {
    const list = ts.filter((t) => t.status === s)
      .sort((a, b) => (b.staleDays || 0) - (a.staleDays || 0));
    // 已完成/已取消堆在看板上只会挡住在做的事。归档功能一直有，但只能一个个点开抽屉里归，
    // 于是没人用，看板就一直被占着。列头直接给一个「归档这 N 个」。
    const arch = ARCHIVABLE.includes(s) && list.length
      ? '<a href="#" class="colact" data-arch="' + s + '" title="把这一列全部归档：详情删掉、只留摘要，之后在「归档」页看">归档 ' + list.length + ' 个</a>'
      : '';
    // 列头在 .col 上、卡片在 .colbody 里：滚动只发生在 .colbody，列头就自然一直在。
    return '<div class="col" data-status="' + s + '"><h3><b>' + ST_CN[s] + '</b>' +
      '<span>' + arch + (arch ? '' : list.length) + '</span></h3>' +
      '<div class="colbody">' +
      (list.length ? list.map(cardHtml).join('') : '<div class="empty">空</div>') +
      '</div></div>';
  }).join('') + '</div>';
}

const QUAD = [
  { k: 'a', t: '重要 且 紧急', h: '马上做', pri: '高', urgent: true },
  { k: 'b', t: '重要 不紧急', h: '安排时间做', pri: '高', urgent: false },
  { k: 'c', t: '不重要 但紧急', h: '尽快处理掉', pri: '低', urgent: true },
  { k: 'd', t: '不重要 不紧急', h: '有空再说', pri: '低', urgent: false },
];

/** 紧急 = 有截止日且剩余 ≤7 天（含逾期）。客观算出来的，不用你手工打标。 */
const isUrgent = (t) => t.daysLeft != null && t.daysLeft <= 7;

function renderQuad() {
  const ts = visible('active').filter((t) => t.status === 'running' || t.status === 'blocked');
  const un = ts.filter((t) => !t.priority);
  const box = (q) => {
    const list = ts.filter((t) => t.priority && (q.pri === '高' ? t.priority === '高' : t.priority !== '高') &&
      isUrgent(t) === q.urgent);
    return '<div class="qbox" data-quad="' + q.k + '"><h3>' + q.t + '</h3><div class="qhint">' + q.h +
      ' · ' + list.length + ' 个</div>' +
      (list.length ? list.map(cardHtml).join('') : '<div class="empty">空</div>') + '</div>';
  };
  // 四象限只管"该先做哪个"，做完了却没处放——看板有「已完成」「已取消」两列可以拖进去，
  // 这边一个都没有，于是任务只能一直躺在格子里，四象限越用越脏。补两个收口。
  const bin = '<div class="quadbin">' +
    '<div class="qbin" data-done="done"><b>✓ 做完了</b><span class="sub">拖进来 → 标记「已完成」</span></div>' +
    '<div class="qbin" data-done="cancelled"><b>✕ 不做了</b><span class="sub">拖进来 → 标记「已取消」</span></div>' +
    '</div>';
  return '<div class="quad">' + QUAD.map(box).join('') + '</div>' + bin +
    (un.length ? '<div class="sec">未分类 <span class="sub">（' + un.length +
      ' 个还没设优先级；<span class="only-wide">拖进上面任一象限即可</span>' +
      // 触屏上 HTML5 拖拽根本不触发，不能给手机用户一句"拖进去"然后让他戳半天
      '<span class="only-narrow">点开任务改优先级、改状态</span>，紧急与否按截止日自动算）</span></div>' +
      '<div class="grp"><div class="cards">' + un.map(cardHtml).join('') + '</div></div>' : '');
}

const COLS = [
  ['title', '任务'], ['status', '状态'], ['project', '项目'], ['horizon', '周期'],
  ['priority', '优先级'], ['staleDays', '停滞'], ['daysLeft', '截止'], ['progressCount', '进度'],
];

function renderList(bucket) {
  const ts = visible(bucket).slice().sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'zh')) * sortDir;
  });
  if (!ts.length) return '<div class="empty">没有符合条件的任务</div>';
  return '<table><thead><tr>' +
    COLS.map(([k, n]) => '<th data-k="' + k + '">' + n + (sortKey === k ? (sortDir > 0 ? ' ↑' : ' ↓') : '') + '</th>').join('') +
    '</tr></thead><tbody>' + ts.map((t) =>
      '<tr data-name="' + esc(t.name) + '" data-bucket="' + esc(t.bucket) + '">' +
      '<td>' + esc(t.title) + '</td>' +
      '<td>' + (ST_CN[t.status] || esc(t.status)) + '</td>' +
      '<td>' + esc(t.project || '—') + '</td>' +
      '<td>' + esc(t.horizon || '—') + '</td>' +
      '<td>' + esc(t.priority || '—') + '</td>' +
      // 已完成/已取消的任务显示"停滞 92 天"没有意义——它不是搁置，是结束了
      '<td>' + (t.staleDays == null || closed(t) ? '—' : t.staleDays + ' 天') + '</td>' +
      '<td>' + (t.daysLeft == null || closed(t) ? '—' : (t.daysLeft < 0 ? '逾期 ' + (-t.daysLeft) : '剩 ' + t.daysLeft) + ' 天') + '</td>' +
      '<td>' + t.progressCount + '</td></tr>').join('') + '</tbody></table>';
}

function renderGroup() {
  const ts = visible('active');
  const by = new Map();
  for (const t of ts) {
    const k = t.project || '（未分项目）';
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(t);
  }
  const keys = [...by.keys()].sort((a, b) => (a.startsWith('（') ? 1 : b.startsWith('（') ? -1 : a.localeCompare(b, 'zh')));
  if (!keys.length) return '<div class="empty">没有符合条件的任务</div>';
  return keys.map((k) => {
    const list = by.get(k);
    const done = list.filter((t) => t.status === 'done').length;
    return '<div class="grp"><h3>' + esc(k) +
      ' <span class="chip">' + list.length + ' 个</span>' +
      ' <span class="chip">完成 ' + done + '/' + list.length + '</span></h3>' +
      '<div class="cards">' + list.map(cardHtml).join('') + '</div></div>';
  }).join('');
}

/**
 * 体检页。
 *
 * 原来这页只是把问题列出来就完了：看见"停滞 93 天"，你能做的只有点进抽屉自己改。
 * 更别扭的是两个空区各占一大块屏说"没有逾期任务"，而真正有内容的两区和顶部横幅
 * 完全重复——整页读下来全是"你有问题"，却一个能动手的地方都没有。
 *
 * 现在：每条都带**可以当场点掉的处理动作**；空区压成一行；顶部给一句总结，
 * 全清了就明确说"没发现问题"，而不是让人从四个空区里自己推断。
 */
function renderHealth() {
  const h = S.health;
  if (!h) return '<div class="empty">无数据</div>';

  // 处理动作。每条问题都该能在这一页当场了结，而不是"记下来，回头去别处改"。
  const act = (x, kind, label, title) =>
    '<a href="#" class="hact" data-hact="' + kind + '" data-name="' + esc(x.name) +
    '" data-bucket="active"' + (title ? ' title="' + esc(title) + '"' : '') + '>' + label + '</a>';
  const openA = (x, label) => '<a href="#" class="hact" data-name="' + esc(x.name) +
    '" data-bucket="active">' + (label || '打开') + '</a>';

  const sec = (title, n, rows, empty) =>
    '<div class="sec">' + title + (n ? ' <span class="sub">（' + n + '）</span>' : '') + '</div>' +
    (rows.length ? '<table><tbody>' + rows.join('') + '</tbody></table>'
      : '<div class="hok">✓ ' + empty + '</div>');

  const trouble = h.stale.length + h.overdue.length + h.duplicates.length;
  const head = '<div class="hsum ' + (trouble ? 'bad' : 'ok') + '">' +
    (trouble ? '体检发现 <b>' + trouble + '</b> 处要处理 —— 每条右边都能直接点掉，不用再进抽屉'
             : '✓ 体检没发现问题：没有停滞、没有逾期、没有疑似重复') + '</div>';

  return head +
    sec('⏳ 停滞超过 ' + h.staleThreshold + ' 天（进行中）', h.stale.length,
      h.stale.map((x) => '<tr><td>' + openA(x, esc(x.title)) +
        '</td><td style="text-align:right;color:var(--warn);white-space:nowrap">' + x.days + ' 天</td>' +
        '<td class="hacts">' + act(x, 'done', '做完了', '标记为已完成') +
        act(x, 'blocked', '卡住了', '标记为阻塞——停滞不是因为你忘了，是它推不动') +
        act(x, 'cancelled', '不做了', '标记为已取消') + '</td></tr>'), '没有停滞任务') +

    sec('⛔ 已逾期', h.overdue.length,
      h.overdue.map((x) => '<tr><td>' + openA(x, esc(x.title)) +
        '</td><td style="text-align:right;color:var(--bad);white-space:nowrap">逾期 ' + (-x.left) + ' 天</td>' +
        '<td class="hacts">' + act(x, 'done', '做完了') +
        act(x, 'post7', '顺延 7 天', '把截止日改到 7 天后') +
        act(x, 'nodue', '去掉截止日') + '</td></tr>'), '没有逾期任务') +

    sec('📅 7 天内到期', h.dueSoon.length,
      h.dueSoon.map((x) => '<tr><td>' + openA(x, esc(x.title)) +
        '</td><td style="text-align:right;color:var(--ok);white-space:nowrap">' +
        (x.left === 0 ? '今天' : '剩 ' + x.left + ' 天') + '</td>' +
        '<td class="hacts">' + act(x, 'done', '做完了') + '</td></tr>'), '近 7 天没有到期') +

    // 重复这一组：横幅上早就能按「不是重复 ×」，体检页却只能干看着。同一件事两处行为不一致，
    // 用户只会觉得"按了怎么还在"。这里用同一个 dkey，按掉两边一起消失。
    sec('🔁 疑似重复', h.duplicates.length,
      h.duplicates.map((g) => {
        const k = dkey('dup', g.map((x) => x.name));
        return '<tr><td colspan="2">' + g.map((x) => openA(x, esc(x.title))).join('　×　') + '</td>' +
          '<td class="hacts">' + (isDismissed(k)
            ? '<span class="sub">已按掉</span>'
            : '<a href="#" class="hact bdismiss" data-key="' + esc(k) + '">不是重复</a>') + '</td></tr>';
      }), '没有发现重复');
}

// ---------------------------------------------------------------- 抽屉

// 抽屉进浏览器历史：电脑上「后退」就该关掉抽屉、而不是把整个面板退没了；
// 顺带 #t/任务名 可以直接收藏成书签，副屏上盯着某个任务时很有用。
// navPop 防环：popstate 触发的关闭不能再 back 一次。
let navPop = false;
const taskHash = (name) => '#t/' + encodeURIComponent(name);

async function open(name, bucket) {
  try {
    cur = await api('detail', { name, bucket });
    if (location.hash !== taskHash(name)) {
      history.pushState({ task: name, bucket: bucket || 'active' }, '', taskHash(name));
    }
    $('dTitle').textContent = cur.title;
    $('dSub').textContent = (ST_CN[cur.status] || cur.status) + ' · 建于 ' + (cur.created || '—') +
      (cur.staleDays != null ? ' · 停滞 ' + cur.staleDays + ' 天' : '');
    $('dBody').innerHTML = drawerBody(cur);
    $('mask').classList.add('on');
    $('drawer').classList.add('on');
    wireDrawer();
  } catch (e) { toast('打开失败：' + e.message, true); }
}

function closeDrawer() {
  const wasOpen = $('drawer').classList.contains('on');
  $('mask').classList.remove('on');
  $('drawer').classList.remove('on');
  cur = null;
  // 用叉/Esc/遮罩关的，也要把历史退回去，否则按一次「后退」又把抽屉勾回来
  if (wasOpen && !navPop && history.state && history.state.task) history.back();
}

// 「后退」= 关抽屉；「前进」或直接打开带 #t/... 的书签 = 开那个任务
addEventListener('popstate', async (e) => {
  navPop = true;
  try {
    const st = e.state;
    if (st && st.task) await open(st.task, st.bucket);
    else closeDrawer();
  } finally { navPop = false; }
});

function drawerBody(t) {
  const ro = S.offline ? ' disabled' : '';
  const sel = (id, opts, val, ph) => '<select id="' + id + '"' + ro + '><option value="">' + ph + '</option>' +
    opts.map((o) => '<option' + (o === val ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  return '<div class="fields">' +
      '<label>状态</label>' + '<select id="fStatus"' + ro + '>' + ST_ORDER.map((s) =>
        '<option value="' + s + '"' + (s === t.status ? ' selected' : '') + '>' + ST_CN[s] + '</option>').join('') + '</select>' +
      '<label>周期</label>' + sel('fHorizon', S.meta.horizons || [], t.horizon, '（未设）') +
      '<label>优先级</label>' + sel('fPriority', S.meta.priorities || [], t.priority, '（未设）') +
      '<label>项目</label>' + '<input id="fProject" value="' + esc(t.project) + '" placeholder="（未设）"' + ro + '>' +
      '<label>截止日</label>' + '<input id="fDeadline" type="date" value="' + esc(t.deadline ? t.deadline.slice(0, 10) : '') + '"' + ro + '>' +
    '</div>' +
    (S.offline ? '' : '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button id="fSave" class="primary">保存字段</button>' +
      // 归档只对已完成/已取消开放：CLAUDE.md 的底线是未完成任务绝不归档，
      // 多了个网页按钮也不松动。已在归档区的自然也不再显示。
      (closed(t) && t.bucket === 'active' ? '<button id="fArchive">归档</button>' : '') +
      '</div>') +
    (t.intro ? '<div class="sec">说明</div><div class="what" style="white-space:pre-wrap;font-size:12.5px;color:var(--dim)">' + esc(t.intro) + '</div>' : '') +
    '<div class="sec">当前进度 <span class="sub">（' + t.progress.length + ' 条）</span></div>' +
    (t.progress.length
      ? '<div class="tl">' + t.progress.map((p) =>
          '<div class="ev"><div class="when">' + esc(p.date + ' ' + p.time) + '</div>' +
          '<div class="what">' + esc(p.text) + '</div></div>').join('') + '</div>'
      : '<div class="empty">还没有进度记录</div>') +
    // 下一步计划可编辑：卡片正面推的就是这一条，之前只能看不能改，
    // 想调整得去改文件——那这个面板就只做完了一半。
    '<div class="sec">下一步计划 <span class="sub">（一行一条）</span></div>' +
    (S.offline
      ? (t.next.length ? '<ul style="margin:0;padding-left:20px">' + t.next.map((n) =>
          '<li style="font-size:12.5px;white-space:pre-wrap">' + esc(n) + '</li>').join('') + '</ul>'
          : '<div class="empty">没有计划条目</div>')
      : '<textarea id="fNext" rows="' + Math.min(8, Math.max(3, t.next.length + 1)) + '" ' +
        'placeholder="下一步要做什么？一行一条">' + esc(t.next.join('\n')) + '</textarea>' +
        '<div style="margin-top:8px"><button id="fNextSave">保存计划</button></div>') +
    (t.links && t.links.length
      ? '<div class="sec">关联任务</div><div class="meta">' + t.links.map((l) =>
          '<a href="#" class="chip" data-name="' + esc(l) + '" data-bucket="active">' + esc(l) + '</a>').join('') + '</div>'
      : '');
}

// ---------------------------------------------------------------- 写操作

async function patch(name, bucket, p, label) {
  if (S.offline) return toast('离线快照，改不了', true);
  try {
    const r = await api('setFields', { name, bucket, patch: p });
    if (!r.changed.length) return toast('没有变化');
    toast(label || '已保存');
    await reload();
    if (cur && cur.name === name) await open(name, bucket);
  } catch (e) { toast('保存失败：' + e.message, true); }
}

// ---------------------------------------------------------------- 事件绑定

function wire() {
  // 卡片 / 表格行 → 打开抽屉。
  // :not([data-hact]) 很关键：体检页的处理按钮自己也带 data-name（要知道处理哪个任务），
  // 不排掉的话点「做完了」会变成打开抽屉——按钮看着像坏的。
  document.querySelectorAll('#view .card, #view tbody tr, #view a[data-name]:not([data-hact])').forEach((el) => {
    el.addEventListener('click', (e) => {
      if (e.target.closest('[data-hact],[data-arch],.bdismiss')) return;   // 行里的动作键不当"打开"
      e.preventDefault();
      const n = el.dataset.name, b = el.dataset.bucket || 'active';
      if (n) open(n, b);
    });
  });
  // 表头排序
  document.querySelectorAll('#view th[data-k]').forEach((th) => {
    th.addEventListener('click', () => {
      const k = th.dataset.k;
      if (sortKey === k) sortDir = -sortDir; else { sortKey = k; sortDir = k === 'title' ? 1 : -1; }
      savePrefs();
      render();
    });
  });
  if (!S.offline) { wireDragBoard(); wireDragQuad(); }
}

// 横幅上的动作键。横幅每次 render 都重建，所以绑在容器上。
$('banners').addEventListener('click', async (e) => {
  const a = e.target.closest('a');
  if (!a) return;
  e.preventDefault();

  if (a.classList.contains('bfocus')) {
    const set = focusSets[a.dataset.focus];
    return setFocus(set ? set.names : null, set ? set.label : '');
  }
  if (a.id === 'hideOffline') { offlineHidden = true; return render(); }
  // 先本地生效再落盘：等一个来回才消失会让人以为没点上。体检页共用 doDismiss。
  if (a.classList.contains('bdismiss')) return doDismiss(a.dataset.key);
});

/** 按掉一条提醒（横幅和体检页共用同一套 key，按一次两边一起消失）。 */
async function doDismiss(key) {
  if (S.offline) return toast('离线快照改不了，联机后再按', true);
  S.dismissed = Object.assign({}, S.dismissed, { [key]: { at: new Date().toISOString() } });
  render();
  try {
    await api('dismiss', { key });
    toast(key.startsWith('dup:') || key.startsWith('dup') ? '已记下：这组不是重复' : '已按掉，这批任务有变化时会再提醒');
  } catch (err) {
    delete S.dismissed[key];
    render();
    toast('按掉失败：' + err.message, true);
  }
}

/**
 * 视图里的动作键（体检页的处理动作 + 看板列头的归档）。
 * 视图每次 render 都重建，所以绑在 #view 容器上，别绑到具体元素。
 */
$('view').addEventListener('click', async (e) => {
  const a = e.target.closest('a[data-hact], a[data-arch], #view .bdismiss');
  if (!a) return;
  e.preventDefault();

  if (a.classList.contains('bdismiss')) return doDismiss(a.dataset.key);

  // ── 列头「归档 N 个」──────────────────────────────────────────────
  // 归档会删掉任务详情、只留摘要，删掉就找不回来了，所以要点两下：第一下变成"确定归档？"。
  // 和抽屉里那个归档按钮同一套 armed 手法，行为一致，用户不用学第二遍。
  if (a.dataset.arch) {
    const st = a.dataset.arch;
    if (S.offline) return toast('离线快照，改不了', true);
    const list = visible('active').filter((t) => t.status === st);
    if (!list.length) return;
    if (!a.dataset.armed) {
      a.dataset.armed = '1';
      a.classList.add('armed');
      a.textContent = '确定归档这 ' + list.length + ' 个？';
      setTimeout(() => { if (a.isConnected && a.dataset.armed) render(); }, 5000);   // 超时自己缩回去
      return;
    }
    let ok = 0; const bad = [];
    for (const t of list) {
      try { await api('archive', { name: t.name, bucket: t.bucket }); ok++; }
      catch (err) { bad.push(t.title + '（' + err.message + '）'); }
    }
    await reload();
    toast(bad.length ? '归档了 ' + ok + ' 个，' + bad.length + ' 个失败：' + bad[0] : '已归档 ' + ok + ' 个「' + ST_CN[st] + '」',
      bad.length > 0);
    return;
  }

  // ── 体检页的处理动作 ──────────────────────────────────────────────
  const name = a.dataset.name, bucket = a.dataset.bucket || 'active';
  const MAP = {
    done: [{ status: 'done' }, '已标记「已完成」'],
    blocked: [{ status: 'blocked' }, '已标记「阻塞」'],
    cancelled: [{ status: 'cancelled' }, '已标记「已取消」'],
    post7: [{ deadline: daysFromNow(7) }, '截止日已顺延到 ' + daysFromNow(7)],
    nodue: [{ deadline: '' }, '截止日已去掉'],
  };
  const m = MAP[a.dataset.hact];
  if (m) await patch(name, bucket, m[0], m[1]);
});

/** 看板拖拽：拖到另一列 = 改状态。 */
function wireDragBoard() {
  document.querySelectorAll('#view .card').forEach((c) => {
    c.addEventListener('dragstart', (e) => {
      e.dataTransfer.setData('text/plain', JSON.stringify({ name: c.dataset.name, bucket: c.dataset.bucket }));
    });
  });
  document.querySelectorAll('#view .col').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag'); });
    col.addEventListener('dragleave', () => col.classList.remove('drag'));
    col.addEventListener('drop', (e) => {
      e.preventDefault(); col.classList.remove('drag');
      const d = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
      if (d.name) patch(d.name, d.bucket, { status: col.dataset.status }, '已改为「' + ST_CN[col.dataset.status] + '」');
    });
  });
}

/**
 * 四象限拖拽。
 *
 * 原来这里只设优先级，说法是"紧急与否由截止日客观算出，不靠拖"。原则没错，落地错了：
 * 左半边那两格（重要且紧急 / 不重要但紧急）全是「紧急」，而拖动压根不碰截止日，
 * 于是往左拖必然当场弹回右边——**四个格子有两个永远放不进东西**，用户只会以为拖拽坏了。
 * 更糟的是唯一那句提示 toast 紧接着就被"优先级已设为…"的成功 toast 冲掉，等于没提示。
 *
 * 现在：优先级照旧直接落（这半边没歧义）；紧急与否对不上时，**问一句截止日定几号**，
 * 然后优先级 + 截止日一次写入。紧急依然是截止日算出来的，但你拖的那一下真的算数。
 */
function wireDragQuad() {
  document.querySelectorAll('#view .qbox').forEach((box) => {
    box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('drag'); });
    box.addEventListener('dragleave', () => box.classList.remove('drag'));
    box.addEventListener('drop', (e) => {
      e.preventDefault(); box.classList.remove('drag');
      const d = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
      const q = QUAD.find((x) => x.k === box.dataset.quad);
      if (!d.name || !q) return;
      const t = S.tasks.find((x) => x.name === d.name);
      if (t && isUrgent(t) !== q.urgent) return openQuadDlg(t, q);
      patch(d.name, d.bucket, { priority: q.pri }, '优先级已设为「' + q.pri + '」');
    });
  });

  // 收口区：做完了 / 不做了。四象限原来只能往里放、不能收，任务做完也只能一直躺在格子里。
  document.querySelectorAll('#view .qbin').forEach((bin) => {
    bin.addEventListener('dragover', (e) => { e.preventDefault(); bin.classList.add('drag'); });
    bin.addEventListener('dragleave', () => bin.classList.remove('drag'));
    bin.addEventListener('drop', (e) => {
      e.preventDefault(); bin.classList.remove('drag');
      const d = JSON.parse(e.dataTransfer.getData('text/plain') || '{}');
      const st = bin.dataset.done;
      if (!d.name || !st) return;
      patch(d.name, d.bucket, { status: st }, '已改为「' + ST_CN[st] + '」');
    });
  });
}

/** 本地日期 → yyyy-mm-dd。不能用 toISOString()：那是 UTC，东八区傍晚之后会差一天。 */
function ymd(dt) {
  const p = (n) => String(n).padStart(2, '0');
  return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
}
const daysFromNow = (n) => { const dt = new Date(); dt.setDate(dt.getDate() + n); return ymd(dt); };

let quadPend = null;

/** 拖进的格子和任务当前的紧急状态对不上时，问清楚截止日再写。 */
function openQuadDlg(t, q) {
  quadPend = { t, q };
  const toUrgent = q.urgent;
  // 快捷项按方向给：要变紧急就给 7 天内的，要变不紧急就给推开 / 去掉
  const quick = toUrgent
    ? [['今天', daysFromNow(0)], ['3 天后', daysFromNow(3)], ['7 天后', daysFromNow(7)]]
    : [['推到 14 天后', daysFromNow(14)], ['清除截止日', '']];

  $('qdTitle').textContent = '放进「' + q.t + '」';
  $('qdWhy').innerHTML = toUrgent
    ? '「紧急」是按<b>截止日</b>算的——7 天内（含逾期）才算紧急，不是手工打的标。'
      + '所以要放进这一格，得先给它一个 7 天内的截止日。'
      + (t.deadline ? '<br>它现在的截止日是 <b>' + esc(t.deadline) + '</b>（还剩 ' + t.daysLeft + ' 天）。' : '<br>它现在<b>没有截止日</b>。')
    : '它的截止日是 <b>' + esc(t.deadline || '(无)') + '</b>，还剩 <b>' + t.daysLeft + '</b> 天，所以算「紧急」。'
      + '要放进这一格，得把截止日推开或者去掉。';

  $('qdQuick').innerHTML = quick.map((x, i) =>
    '<button data-qd="' + i + '" data-val="' + esc(x[1]) + '">' + x[0] + '</button>').join('');
  $('qdQuick').querySelectorAll('button').forEach((b) => {
    b.onclick = () => applyQuad(b.dataset.val);
  });
  $('qdDate').value = toUrgent ? daysFromNow(3) : daysFromNow(14);
  $('mask').classList.add('on');
  $('quadDlg').classList.add('on');
  $('qdDate').focus();
}

function closeQuadDlg() {
  quadPend = null;
  $('quadDlg').classList.remove('on');
  if (!$('drawer').classList.contains('on')) $('mask').classList.remove('on');
}

/** 优先级和截止日一次写进去：两次 patch 会写两遍文件、弹两次 toast、还闪一下中间态。 */
function applyQuad(deadline) {
  if (!quadPend) return;
  const { t, q } = quadPend;
  closeQuadDlg();
  patch(t.name, t.bucket, { priority: q.pri, deadline },
    deadline ? '已放进「' + q.t + '」，截止日 ' + deadline : '已放进「' + q.t + '」，截止日已清除');
}

function wireDrawer() {
  const save = $('fSave');
  if (save) save.onclick = () => patch(cur.name, cur.bucket, {
    status: $('fStatus').value, horizon: $('fHorizon').value,
    priority: $('fPriority').value, project: $('fProject').value.trim(),
    deadline: $('fDeadline').value,
  }, '字段已保存');

  const nx = $('fNextSave');
  if (nx) nx.onclick = async () => {
    try {
      const r = await api('setNext', { name: cur.name, bucket: cur.bucket, text: $('fNext').value });
      if (!r.changed) return toast('没有变化');
      toast('计划已保存');
      await reload();
      await open(cur.name, cur.bucket);
    } catch (e) { toast('保存失败：' + e.message, true); }
  };

  const ar = $('fArchive');
  if (ar) ar.onclick = async () => {
    // 归档会移动文件，给一次确认——但用页面内的二次点击，不用 confirm()：
    // 浏览器原生弹窗会阻塞整个页面，自动化里还会把会话卡死。
    if (ar.dataset.armed !== '1') {
      ar.dataset.armed = '1';
      ar.textContent = '确认归档？再点一次';
      ar.style.borderColor = 'var(--bad)';
      ar.style.color = 'var(--bad)';
      setTimeout(() => {
        if (!$('fArchive')) return;
        $('fArchive').dataset.armed = '';
        $('fArchive').textContent = '归档';
        $('fArchive').style.borderColor = '';
        $('fArchive').style.color = '';
      }, 4000);
      return;
    }
    try {
      await api('archive', { name: cur.name, bucket: cur.bucket });
      toast('已归档「' + cur.title + '」');
      closeDrawer();
      await reload();
    } catch (e) { toast('归档失败：' + e.message, true); }
  };

  document.querySelectorAll('#dBody a[data-name]').forEach((a) => {
    a.addEventListener('click', (e) => { e.preventDefault(); open(a.dataset.name, 'active'); });
  });
}

$('dAdd').onclick = async () => {
  const text = $('dProg').value.trim();
  if (!cur || !text) return;
  if (S.offline) return toast('离线快照，改不了', true);
  try {
    await api('addProgress', { name: cur.name, bucket: cur.bucket, text });
    $('dProg').value = '';
    toast('进度已追加');
    await reload();
    await open(cur.name, cur.bucket);
  } catch (e) { toast('追加失败：' + e.message, true); }
};
$('dProg').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('dAdd').click(); });
$('dClose').onclick = closeDrawer;
// 遮罩和 Esc 服务三个浮层（抽屉 + 新建弹窗 + 四象限补截止日），关掉当前开着的那个。
// 四象限那个排最前：它是拖拽当场弹出来的，盖在最上层，Esc 先关它才符合直觉。
const closeTop = () => {
  if ($('quadDlg').classList.contains('on')) closeQuadDlg();
  else if ($('newDlg').classList.contains('on')) closeNewDlg();
  else closeDrawer();
};
$('mask').onclick = closeTop;

$('qdCancel').onclick = closeQuadDlg;
// "只改优先级"= 保持原来的截止日不动，所以传 undefined 而不是 ''（''是"清除截止日")
// "只改优先级"= 截止日保持不动，所以不传 deadline（传 '' 是"清除截止日"，两回事）。
// 提示里要说清它最后落进了哪一格——你拖的是 A 格，它却停在 B 格，不解释一句就又成了"拖拽坏了"。
$('qdSkip').onclick = () => {
  const p = quadPend;
  closeQuadDlg();
  if (!p) return;
  const land = QUAD.find((x) => (x.pri === '高') === (p.q.pri === '高') && x.urgent === isUrgent(p.t));
  patch(p.t.name, p.t.bucket, { priority: p.q.pri },
    '优先级已设为「' + p.q.pri + '」；截止日没动，所以它落在「' + (land ? land.t : '?') + '」');
};
$('qdOk').onclick = () => applyQuad($('qdDate').value);
$('qdDate').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('qdOk').click(); });

// ── 快捷键 ────────────────────────────────────────────────────────────
// 电脑上这面板多半是常驻副屏、随手切过来看两眼的，一路摸鼠标点很别扭。
// 单键只在"没在输入框里打字、没开浮层"时生效；Ctrl/⌘+K 是浏览器通用手势，哪都能按。
const KEY_VIEWS = ['board', 'quad', 'list', 'group', 'archive', 'health'];
const KEY_HELP = [
  ['/ 或 Ctrl+K', '跳到搜索框'],
  ['1 – 6', '切换视图（看板/四象限/列表/分组/归档/体检）'],
  ['n', '新建任务'],
  ['r', '刷新'],
  ['Esc', '关抽屉 / 清空搜索'],
  ['?', '显示这张表'],
];
document.addEventListener('keydown', (e) => {
  const el = e.target, tag = (el.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || el.isContentEditable;

  if (e.key === 'Escape') {
    if ($('keys').classList.contains('on')) return $('keys').classList.remove('on');
    // 搜索框里按 Esc 先清空搜索——比关掉整个抽屉更像你当下想要的
    if (el === $('q') && $('q').value) { $('q').value = ''; savePrefs(); render(); return; }
    closeTop();
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault(); $('q').focus(); $('q').select(); return;
  }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if ($('drawer').classList.contains('on') || $('newDlg').classList.contains('on')
      || $('quadDlg').classList.contains('on')) return;

  if (e.key === '/') { e.preventDefault(); $('q').focus(); $('q').select(); }
  else if (e.key === '?') { e.preventDefault(); $('keys').classList.toggle('on'); }
  else if (e.key >= '1' && e.key <= '6') {
    view = KEY_VIEWS[+e.key - 1]; savePrefs(); render();
  } else if (e.key === 'n') { e.preventDefault(); openNewDlg(); }
  else if (e.key === 'r') { e.preventDefault(); reload(); }
});

// 新建任务用页面内表单，不用 prompt()：prompt 只能填一个字段，建完还得再开抽屉补周期、
// 优先级、截止日；而且它是阻塞式原生弹窗，PWA 里样式失控、自动化里还会卡死会话。
function openNewDlg() {
  if (S.offline) return toast('离线快照，建不了', true);
  const fill = (sel, arr, ph) => { sel.innerHTML = '<option value="">' + ph + '</option>' +
    arr.map((x) => '<option>' + esc(x) + '</option>').join(''); };
  fill($('nHorizon'), S.meta.horizons || [], '（默认短期）');
  fill($('nPriority'), S.meta.priorities || [], '（未设）');
  $('nTitle').value = ''; $('nProject').value = ''; $('nDeadline').value = ''; $('nPlan').value = '';
  $('mask').classList.add('on');
  $('newDlg').classList.add('on');
  setTimeout(() => $('nTitle').focus(), 30);
}
function closeNewDlg() {
  $('newDlg').classList.remove('on');
  if (!$('drawer').classList.contains('on')) $('mask').classList.remove('on');
}
$('btnNew').onclick = openNewDlg;
$('nCancel').onclick = closeNewDlg;
$('nOk').onclick = async () => {
  const title = $('nTitle').value.trim();
  if (!title) { $('nTitle').focus(); return toast('标题不能为空', true); }
  try {
    const r = await api('create', {
      name: title, title,
      horizon: $('nHorizon').value || undefined,
      priority: $('nPriority').value || undefined,
      project: $('nProject').value.trim() || undefined,
      deadline: $('nDeadline').value || undefined,
      plan: $('nPlan').value || undefined,
    });
    closeNewDlg();
    toast('已建「' + r.task.title + '」');
    await reload();
    open(r.task.name, 'active');
  } catch (e) { toast('创建失败：' + e.message, true); }
};
$('nTitle').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('nOk').click(); });

$('btnReload').onclick = reload;
document.querySelectorAll('.tab').forEach((b) =>
  b.addEventListener('click', () => { view = b.dataset.v; savePrefs(); render(); }));
['q', 'fh', 'fp', 'fpri'].forEach((id) =>
  $(id).addEventListener('input', () => { savePrefs(); render(); }));

$('keys').innerHTML = '<h4>快捷键</h4>' +
  KEY_HELP.map(([k, d]) => '<div><kbd>' + esc(k) + '</kbd><span>' + esc(d) + '</span></div>').join('');
$('btnKeys').onclick = () => $('keys').classList.toggle('on');

/** 直接打开收藏的 #t/任务名：先把地址栏复位成干净基点，再照常 open() 推一条历史，
    这样「后退」才有地方可退（否则第一次后退就把整个面板退没了）。 */
function bootHash() {
  const m = /^#t\/(.+)$/.exec(location.hash);
  if (!m) return;
  const name = decodeURIComponent(m[1]);
  history.replaceState(null, '', location.pathname);
  const t = S.tasks.find((x) => x.name === name);
  if (t) open(t.name, t.bucket);
  else toast('书签指向的任务「' + name + '」已经不在了', true);
}

if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
reload().then(bootHash);
setInterval(() => { if (!S.offline && !cur) reload(); }, 60000);
</script>
